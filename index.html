<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>wellformed</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="__THEME_LIGHT__" />
    <script>
      // no-flash theme init — runs before stylesheets paint.
      // __THEME_LIGHT__ / __THEME_DARK__ are substituted by the
      // theme-color-inject plugin in vite.config.ts from
      // src/styles/theme-colors.ts.
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var mode = stored === 'light' || stored === 'dark' ? stored : 'system';
          var dark =
            mode === 'dark' ||
            (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          if (dark) root.classList.add('dark');
          root.style.colorScheme = dark ? 'dark' : 'light';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.content = dark ? '__THEME_DARK__' : '__THEME_LIGHT__';
        } catch (_) {}
      })();
    </script>
    <style>
      html, body { height: 100%; margin: 0; }
      #root { min-height: 100%; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
